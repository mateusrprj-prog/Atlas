name: Atlas Android Build

# Pega QUALQUER .zip na raiz do repositório (o mais recente), extrai e usa como camada Atlas
# (patches/, docs, scripts) sobre o porte do Blender para Android.

on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
    inputs:
      profile:
        description: "Perfil (lite = leve, full = Cycles/USD/vídeo etc.)"
        type: choice
        options: [lite, full]
        default: lite
      upstream_ref:
        description: "Branch/tag/commit do upstream (fixe um commit p/ build reprodutível)"
        default: android
      build_cmd:
        description: "Comando de build (vazio = só inventário). Roda dentro da pasta do upstream."
        default: ""

env:
  UPSTREAM_REPO: https://github.com/simfeo/blender.git
  PROFILE: ${{ inputs.profile || 'lite' }}
  UPSTREAM_REF: ${{ inputs.upstream_ref || 'android' }}
  BUILD_CMD: ${{ inputs.build_cmd || vars.ATLAS_BUILD_CMD }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Localizar e extrair o .zip (qualquer nome)
        run: |
          ZIP=$(ls -t ./*.zip 2>/dev/null | head -1 || true)
          if [ -z "$ZIP" ]; then echo "::error::Nenhum .zip na raiz do repositório. Envie o zip do projeto."; exit 1; fi
          echo "Usando: $ZIP"
          rm -rf atlas_src && mkdir atlas_src && unzip -q -o "$ZIP" -d atlas_src
          MARK=$(find atlas_src -name ATLAS-Contexto.md | head -1 || true)
          if [ -n "$MARK" ]; then ROOT=$(dirname "$MARK"); else ROOT=atlas_src; fi
          echo "ATLAS_ROOT=$(realpath "$ROOT")" >> "$GITHUB_ENV"
          echo "Raiz do projeto Atlas: $ROOT"; ls "$ROOT"

      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar NDK r30+ (o mais novo disponível)
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null || true
          NDK=$("$SM" --list 2>/dev/null | grep -o 'ndk;[0-9.]*' | sort -V | tail -1)
          echo "NDK escolhido: $NDK"
          case "$NDK" in ndk\;3[0-9]*|ndk\;[4-9][0-9]*) ;; *) echo "::error::NDK r30+ não encontrado ($NDK)"; exit 1;; esac
          "$SM" "$NDK"
          echo "ANDROID_NDK_HOME=$SDK/ndk/${NDK#ndk;}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/${NDK#ndk;}" >> "$GITHUB_ENV"

      - name: Clonar upstream (com submódulos; LFS tolerante)
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          mkdir -p inventory
          git clone "$UPSTREAM_REPO" upstream
          cd upstream
          git checkout "$UPSTREAM_REF"
          git submodule update --init --recursive --depth 1
          git rev-parse HEAD | tee ../UPSTREAM_COMMIT.txt
          { echo "== .lfsconfig"; cat .lfsconfig 2>/dev/null || echo "(nenhum)"; echo; echo "== git lfs env"; git lfs env 2>&1; } > ../inventory/lfs-config.txt || true

      - name: Baixar objetos LFS necessários (sem tests/)
        working-directory: upstream
        run: |
          INC="release/*,assets/*,scripts/*,doc/*"
          echo "== tentativa 1: servidor LFS padrão =="
          GIT_LFS_SKIP_SMUDGE=0 git lfs pull --include="$INC" 2>&1 | tail -15 || true
          MISSING=$(git lfs ls-files | grep -E ' - (release|assets|scripts)/' | wc -l || true)
          echo "ausentes após tentativa 1: $MISSING"
          if [ "$MISSING" -gt 0 ]; then
            echo "== tentativa 2: servidor LFS do projeto Blender =="
            git config lfs.url https://projects.blender.org/blender/blender.git/info/lfs
            GIT_LFS_SKIP_SMUDGE=0 git lfs pull --include="$INC" 2>&1 | tail -15 || true
            MISSING=$(git lfs ls-files | grep -E ' - (release|assets|scripts)/' | wc -l || true)
            echo "ausentes após tentativa 2: $MISSING"
          fi
          git lfs ls-files > ../inventory/lfs-files.txt 2>&1 || true
          git lfs ls-files | grep -E ' - (release|assets|scripts)/' > ../inventory/lfs-missing-needed.txt || true
          echo "MISSING_NEEDED=$MISSING" >> "$GITHUB_ENV"

      - name: Aplicar patches Atlas (do .zip)
        run: |
          shopt -s nullglob
          for p in "$ATLAS_ROOT"/patches/*.patch; do
            echo ">> aplicando $(basename "$p")"
            git -C upstream apply --index "$p"
          done
          echo "patches concluídos."

      - name: Inventário de build (docs/scripts do porte)
        run: |
          mkdir -p inventory
          cp UPSTREAM_COMMIT.txt inventory/
          cd upstream
          { echo "## arquivos android relevantes"; \
            find . -ipath '*android*' \( -name '*.md' -o -name '*.sh' -o -name 'CMakeLists.txt' -o -name 'build.gradle*' -o -name 'settings.gradle*' -o -name '*.yml' \) \
              -not -path './lib/*' -not -path './.git/*' | head -200; } > ../inventory/android-files.txt
          ls .github/workflows 2>/dev/null > ../inventory/upstream-workflows.txt || true
          for f in README.md ANDROID*.md android/README.md; do [ -f "$f" ] && { echo "=== $f"; cat "$f"; } >> ../inventory/android-docs.txt; done || true
          cat .github/workflows/*android* >> ../inventory/upstream-android-workflow.txt 2>/dev/null || true
          for f in build_files/android/README.md build_files/android/BUILDING.md build_files/android/env.sh build_files/android/configure.sh build_files/android/build_apk.sh build_files/android/apk/package.sh; do
            [ -f "$f" ] && { echo; echo "=================== $f"; head -c 30000 "$f"; } >> ../inventory/android-build-docs.txt
          done || true

      - name: Publicar inventário
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-inventory
          path: inventory/

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ env.PROFILE }}-${{ github.sha }}
          restore-keys: ccache-${{ env.PROFILE }}-

      - name: Build (input build_cmd ou variável ATLAS_BUILD_CMD)
        if: ${{ env.BUILD_CMD != '' }}
        working-directory: upstream
        env:
          ATLAS_PROFILE: ${{ env.PROFILE }}
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build ccache
          export CCACHE_DIR="$HOME/.cache/ccache"
          echo "Executando: $BUILD_CMD"
          bash -c "$BUILD_CMD"

      - name: Aviso — comando de build não informado
        if: ${{ env.BUILD_CMD == '' }}
        run: echo "::notice::Rode de novo informando build_cmd (ou defina ATLAS_BUILD_CMD). Veja atlas-inventory/android-build-docs.txt."

      - name: Publicar APKs
        if: ${{ env.BUILD_CMD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: atlas-apk-${{ env.PROFILE }}
          path: upstream/**/*.apk
          if-no-files-found: error
          
