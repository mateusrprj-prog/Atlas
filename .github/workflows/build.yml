name: Atlas Android Build

# Pega QUALQUER .zip na raiz do repositório (o mais recente) como camada Atlas (patches/, docs)
# e compila o porte Android do Blender seguindo o BUILDING.md do próprio porte.

on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
    inputs:
      profile:
        description: "Perfil (lite = mais leve; full = Cycles/USD/vídeo etc.)"
        type: choice
        options: [lite, full]
        default: lite
      upstream_ref:
        description: "Branch/tag/commit do upstream (fixe um commit p/ build reprodutível)"
        default: android
      build_cmd:
        description: "Opcional: comando próprio de build (vazio = build_apk.sh do porte)"
        default: ""

env:
  UPSTREAM_REPO: https://github.com/simfeo/blender.git
  PROFILE: ${{ inputs.profile || 'lite' }}
  UPSTREAM_REF: ${{ inputs.upstream_ref || 'android' }}
  BUILD_CMD: ${{ inputs.build_cmd || vars.ATLAS_BUILD_CMD }}
  NDK_VER: "30.0.14904198-beta1"
  LFS_BLENDER: https://projects.blender.org/blender/blender.git/info/lfs

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Localizar e extrair o .zip (qualquer nome)
        run: |
          ZIP=$(ls -t ./*.zip 2>/dev/null | head -1 || true)
          if [ -z "$ZIP" ]; then echo "::error::Nenhum .zip na raiz do repositório."; exit 1; fi
          echo "Usando: $ZIP"
          rm -rf atlas_src && mkdir atlas_src && unzip -q -o "$ZIP" -d atlas_src
          MARK=$(find atlas_src -name ATLAS-Contexto.md | head -1 || true)
          if [ -n "$MARK" ]; then ROOT=$(dirname "$MARK"); else ROOT=atlas_src; fi
          echo "ATLAS_ROOT=$(realpath "$ROOT")" >> "$GITHUB_ENV"
          mkdir -p inventory

      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift \
                      /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules /opt/microsoft /opt/az || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dependências do host (GCC 14+, Ninja, patchelf, git-lfs, ccache)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf zip unzip git-lfs ccache python3 curl
          sudo apt-get install -y gcc-14 g++-14 || sudo apt-get install -y gcc-15 g++-15
          cmake --version | head -1; gcc-14 --version 2>/dev/null | head -1 || gcc-15 --version | head -1
          git lfs install

      - name: Android SDK + NDK r30
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          # env.sh do porte espera o SDK em $HOME/android-sdk
          [ -e "$HOME/android-sdk" ] || ln -s "$SDK" "$HOME/android-sdk"
          set +o pipefail
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --list --channel=3 2>/dev/null | grep -i 'ndk;' > inventory/ndk-all.txt || true
          CANDS=$(grep -oE 'ndk;3[0-9]\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+)?' inventory/ndk-all.txt | sed 's/^ndk;//' | sort -u)
          echo "NDK 30+ disponíveis:"; echo "$CANDS"
          if echo "$CANDS" | grep -qx "$NDK_VER"; then PICK="$NDK_VER"; else PICK=$(echo "$CANDS" | sort -V | tail -1); fi
          if [ -z "$PICK" ]; then echo "::error::Nenhum NDK r30+ encontrado (veja atlas-inventory/ndk-all.txt)"; exit 1; fi
          echo "NDK escolhido: $PICK (pedido pelo porte: $NDK_VER)"
          PKGS=("ndk;$PICK" "platform-tools" "build-tools;35.0.1" "platforms;android-35")
          "$SM" --channel=3 "${PKGS[@]}" || sudo "$SM" --channel=3 "${PKGS[@]}"
          test -d "$HOME/android-sdk/ndk/$PICK"
          echo "ANDROID_NDK_VERSION=$PICK" >> "$GITHUB_ENV"
          ls "$HOME/android-sdk/ndk" "$HOME/android-sdk/build-tools"

      - name: Clonar upstream
        env:
          GIT_LFS_SKIP_SMUDGE: "1"   # o LFS do GitHub (mirror) dá 404; usamos o servidor do Blender abaixo
        run: |
          git clone "$UPSTREAM_REPO" upstream
          cd upstream
          git checkout "$UPSTREAM_REF"
          git rev-parse HEAD | tee ../UPSTREAM_COMMIT.txt
          cp ../UPSTREAM_COMMIT.txt ../inventory/

      - name: LFS do projeto Blender (sem tests/)
        working-directory: upstream
        run: |
          # sem terminal: credenciais vazias, só para esse host (conteúdo público)
          git config --global credential.https://projects.blender.org.helper '!f() { echo username=; echo password=; }; f'
          git config lfs.url "$LFS_BLENDER"
          GIT_LFS_SKIP_SMUDGE=0 git lfs pull --include="release/*,assets/*,scripts/*,doc/*" 2>&1 | tail -15
          git lfs ls-files | grep -E ' - (release|assets|scripts)/' > ../inventory/lfs-missing-needed.txt || true
          echo "LFS necessários ausentes: $(wc -l < ../inventory/lfs-missing-needed.txt)"
          test ! -s ../inventory/lfs-missing-needed.txt

      - name: Bibliotecas pré-compiladas (lib/android_arm64 + lib/linux_x64)
        working-directory: upstream
        run: |
          (git submodule update --init --depth 1 lib/android_arm64 || git submodule update --init lib/android_arm64)
          (git -c submodule.lib/linux_x64.update=checkout submodule update --init --depth 1 lib/linux_x64 \
            || git -c submodule.lib/linux_x64.update=checkout submodule update --init lib/linux_x64)
          du -sh lib/android_arm64 lib/linux_x64 || true
          df -h /

      - name: Aplicar patches Atlas (do .zip)
        run: |
          shopt -s nullglob
          for p in "$ATLAS_ROOT"/patches/*.patch; do
            echo ">> aplicando $(basename "$p")"
            git -C upstream apply --index "$p"
          done
          echo "patches concluídos."

      - name: Vulkan headers (não vêm no conjunto pré-compilado)
        run: |
          VER=$(grep -oE 'VULKAN_VERSION[^0-9]*[0-9]+\.[0-9]+\.[0-9]+' upstream/build_files/build_environment/cmake/versions.cmake | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          VER="${VER:-1.4.341}"
          echo "Vulkan-Headers $VER"
          curl -fL -o /tmp/vh.tar.gz "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v$VER.tar.gz"
          tar -xzf /tmp/vh.tar.gz -C /tmp
          mkdir -p blender_build_android/lib/vulkan_headers
          cp -R "/tmp/Vulkan-Headers-$VER/include" blender_build_android/lib/vulkan_headers/include

      - name: Preparar pasta do ccache
        run: mkdir -p "$HOME/.cache/ccache"

      - name: Restaurar cache do compilador (ccache)
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ env.PROFILE }}-${{ github.run_id }}
          restore-keys: ccache-${{ env.PROFILE }}-

      - name: Build do APK (pode levar horas)
        id: build
        timeout-minutes: 320   # sobra tempo para salvar o cache e os logs mesmo se estourar
        working-directory: upstream
        env:
          CCACHE_DIR: ~/.cache/ccache
          CCACHE_MAXSIZE: 6G
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          export CCACHE_DIR="$HOME/.cache/ccache"; mkdir -p "$CCACHE_DIR"
          CMD="${BUILD_CMD:-bash build_files/android/build_apk.sh $PROFILE}"
          echo "Executando: $CMD"
          bash -c "$CMD" 2>&1 | tee ../build.log
          ccache -s || true

      - name: Salvar cache do compilador
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ env.PROFILE }}-${{ github.run_id }}

      - name: Resumo do build (últimas linhas)
        if: always()
        run: |
          [ -f build.log ] && tail -n 300 build.log > inventory/build-tail.txt || true
          find blender_build_android -name '*.apk' -exec ls -la {} \; > inventory/apk-list.txt 2>&1 || true
          df -h / > inventory/disk.txt

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-apk-${{ env.PROFILE }}
          path: blender_build_android/android_apk_stage_*/*.apk
          if-no-files-found: error

      - name: Publicar logs/inventário
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-inventory
          path: inventory/
          
